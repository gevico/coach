<svg id="course-diagram" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 533.015625px;" viewBox="0 0 533.015625 70" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#course-diagram{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#000000;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#course-diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#course-diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#course-diagram .error-icon{fill:#552222;}#course-diagram .error-text{fill:#552222;stroke:#552222;}#course-diagram .edge-thickness-normal{stroke-width:1px;}#course-diagram .edge-thickness-thick{stroke-width:3.5px;}#course-diagram .edge-pattern-solid{stroke-dasharray:0;}#course-diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#course-diagram .edge-pattern-dashed{stroke-dasharray:3;}#course-diagram .edge-pattern-dotted{stroke-dasharray:2;}#course-diagram .marker{fill:#666;stroke:#666;}#course-diagram .marker.cross{stroke:#666;}#course-diagram svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#course-diagram p{margin:0;}#course-diagram .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#000000;}#course-diagram .cluster-label text{fill:#333;}#course-diagram .cluster-label span{color:#333;}#course-diagram .cluster-label span p{background-color:transparent;}#course-diagram .label text,#course-diagram span{fill:#000000;color:#000000;}#course-diagram .node rect,#course-diagram .node circle,#course-diagram .node ellipse,#course-diagram .node polygon,#course-diagram .node path{fill:#eee;stroke:#999;stroke-width:1px;}#course-diagram .rough-node .label text,#course-diagram .node .label text,#course-diagram .image-shape .label,#course-diagram .icon-shape .label{text-anchor:middle;}#course-diagram .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#course-diagram .rough-node .label,#course-diagram .node .label,#course-diagram .image-shape .label,#course-diagram .icon-shape .label{text-align:center;}#course-diagram .node.clickable{cursor:pointer;}#course-diagram .root .anchor path{fill:#666!important;stroke-width:0;stroke:#666;}#course-diagram .arrowheadPath{fill:#333333;}#course-diagram .edgePaths .path{stroke:#666;stroke-width:1px;}#course-diagram .flowchart-link{stroke:#666;fill:none;}#course-diagram .edgeLabel{background-color:white;text-align:center;}#course-diagram .edgeLabel p{background-color:white;}#course-diagram .edgeLabel rect{opacity:0.5;background-color:white;fill:white;}#course-diagram .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#course-diagram .cluster rect{fill:hsl(0, 0%, 98.9215686275%);stroke:#707070;stroke-width:1px;}#course-diagram .cluster text{fill:#333;}#course-diagram .cluster span{color:#333;}#course-diagram .node .collapsed-indicator{fill:#707070;stroke:none;opacity:0.6;}#course-diagram .node .collapsed-separator{stroke:#707070;stroke-width:0.75px;}#course-diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(-160, 0%, 93.3333333333%);border:1px solid #707070;border-radius:2px;pointer-events:none;z-index:100;}#course-diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#000000;}#course-diagram rect.text{fill:none;stroke-width:0;}#course-diagram .icon-shape,#course-diagram .image-shape{background-color:white;text-align:center;}#course-diagram .icon-shape p,#course-diagram .image-shape p{background-color:white;padding:2px;}#course-diagram .icon-shape .label rect,#course-diagram .image-shape .label rect{opacity:0.5;background-color:white;fill:white;}#course-diagram .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#course-diagram .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#course-diagram .node .neo-node{stroke:#999;}#course-diagram [data-look="neo"].node rect,#course-diagram [data-look="neo"].cluster rect,#course-diagram [data-look="neo"].node polygon{stroke:url(#course-diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#course-diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#course-diagram [data-look="neo"].node path{stroke:url(#course-diagram-gradient);stroke-width:1px;}#course-diagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#course-diagram [data-look="neo"].node .neo-line path{stroke:#999;filter:none;}#course-diagram [data-look="neo"].node circle{stroke:url(#course-diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#course-diagram [data-look="neo"].node circle .state-start{fill:#000000;}#course-diagram [data-look="neo"].icon-shape .icon{fill:url(#course-diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#course-diagram [data-look="neo"].icon-shape .icon-neo path{stroke:url(#course-diagram-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#course-diagram :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="course-diagram_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="course-diagram_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="course-diagram_flowchar