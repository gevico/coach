<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Coach：用 Markdown 编写板书，按照节奏展开讲解">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8f6ff"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="208" rx="24"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="208" rx="24" fill="url(#paper)" stroke="#eeebf4"/>
  <g clip-path="url(#card)">
    <circle cx="1170" cy="20" r="95" fill="#eee8ff" opacity=".6"/>
    <circle cx="32" cy="198" r="75" fill="#fff5cf" opacity=".65"/>
  </g>
  <rect x="508" y="111" width="184" height="10" rx="2" fill="#fff0b8"/>
  <text x="600" y="111" text-anchor="middle" fill="#262626" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="68" font-weight="750" letter-spacing="-3">coach</text>
  <text x="600" y="160" text-anchor="middle" fill="#737373" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">用 Markdown 编写板书，按照节奏展开讲解</text>
  <rect x="566" y="187" width="68" height="3" rx="1.5" fill="#6741d9" opacity=".6"/>
